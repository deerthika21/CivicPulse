# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo. Fill the `sync: false` values when prompted.
services:
  # ---------- API ----------
  - type: web
    name: civicpulse-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # TypeScript is a devDependency, so include dev deps for the build step.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: ATLAS_VECTOR_INDEX
        value: complaint_embedding_index
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DUPLICATE_SIMILARITY_THRESHOLD
        value: "0.85"
      - key: DUPLICATE_RADIUS_METERS
        value: "300"
      # Your static site URL, e.g. https://civicpulse.onrender.com (comma-separate several)
      - key: CLIENT_ORIGIN
        sync: false

  # ---------- Web app ----------
  - type: web
    name: civicpulse
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your API URL, e.g. https://civicpulse-api.onrender.com (no trailing slash)
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA: let React Router handle every path
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
